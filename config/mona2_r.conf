#Mouse config ---------------------
# ZMK v0.4 (Zephyr 4.1) 以降、badjeff さんの PMW3610 モジュールは
# CONFIG_PMW3610_* から CONFIG_PMW3610_ALT_* へ改名されている
# CONFIG_PMW3610_ALT_INVERT_X=y
# CONFIG_PMW3610_ALT_INVERT_Y=y
# CONFIG_PMW3610_ALT_SWAP_XY=y
# CONFIG_PMW3610_ALT_REPORT_INTERVAL_MIN=12
# CONFIG_PMW3610_ALT_INIT_POWER_UP_EXTRA_DELAY_MS=300 // <--see Troubleshooting

#Encoder config -------------------
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

#Battery config -------------------
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#Layer LED config -------------------
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_SHOW_LAYER_COLORS=y

#ZMK Studio config -------------------
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

#DYA Studio modules ------------------
# Custom Settings (設定永続化の共通基盤)
# runtime-input-processor / runtime-combo / runtime-macro がこの上に乗る
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
# ランタイムマクロ本体 (最大256バイト) を保存できるようにする
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256

# Settings RPC (注: サブフラグは _STUDIO_RPC ではなく _STUDIO)
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

# Battery History は無効 (使わない)
# CONFIG_ZMK_BATTERY_HISTORY=y
# CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y

# BLE Management
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

# Runtime Input Processor (トラックボール用)
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

# Runtime Sensor Rotate (エンコーダ用)
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_RUNTIME_SENSOR_ROTATE_STUDIO_RPC=y

# Runtime Combo (DYA Studio からコンボを追加・編集・削除)
# https://github.com/cormoran/zmk-feature-runtime-combo
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y
# スロット数。1スロットあたり RAM 約64バイト (16スロットで約1KB)
CONFIG_ZMK_RUNTIME_COMBO_MAX_COMBOS=16
# 旧 zmk,combos のデフォルト (50ms) に合わせる
CONFIG_ZMK_RUNTIME_COMBO_DEFAULT_TIMEOUT_MS=50

# Runtime Macro (DYA Studio からマクロを作成・編集・削除)
# https://github.com/cormoran/zmk-feature-runtime-macro
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
# ランタイムマクロは behavior local ID で束縛を保存するため CRC16 が必要
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y
# 同時に存在できるマクロ数 (キーマップ側の &rmacro <slot> の上限)
CONFIG_ZMK_RUNTIME_MACRO_COUNT=8
# 全マクロで共有する name+body プール
CONFIG_ZMK_RUNTIME_MACRO_POOL_BYTES=1024
CONFIG_ZMK_RUNTIME_MACRO_MAX_BYTES=256

# Mouse Gesture RPC (DYA Studioから動的設定)
CONFIG_ZMK_MOUSE_GESTURE_RPC=y

#Bluetooth config -------------------
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12

# ── USB polling rate ──
CONFIG_USB_HID_POLL_INTERVAL_MS=1

# Phase 2: rebuild trigger

# Phase 3: rebuild trigger

# Phase 3 retry

# Phase 4 trigger

# Phase 5 retry

# Studio RPC buffer sizes
# 2048-byte buffers made Studio keymap loading freeze with 5+ layers on nRF52840.
# Keep buffers moderate so keymap RPC and mouse gesture RPC can coexist.
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=512
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=512

# Custom RPC payload size for our mouse_gesture subsystem
# (runtime-combo は 96B, runtime-macro は 192B あれば足りるので 512 で両立できる)
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=512

# ── Custom RPC を増やしたことによるスタック調整 ──
# 大きな通知ボディをエンコードする際のスタックオーバーフロー対策。
# cormoran/zmk-keyboard-dya2 v2.0 の dya2_right.conf と同じ値。
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000

# 編集直後の電源断でも設定が消えにくいよう、フラッシュ書き込みまでの
# デバウンスを短縮する (トレードオフ: フラッシュ書き込み回数が増える)
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
