manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: cormoran    # <-- DYA Studio (custom ZMK fork + modules)
      url-base: https://github.com/cormoran
    - name: sayu-hub
      url-base: https://github.com/sayu-hub
    - name: badjeff    # <-- PMW3610
      url-base: https://github.com/badjeff
    - name: sekigon-gonnoc    # <-- PAW3222
      url-base: https://github.com/sekigon-gonnoc
    - name: caksoylar  # <-- RGB LED
      url-base: https://github.com/caksoylar
    - name: zettaface  # <-- Input Processor Keybind
      url-base: https://github.com/zettaface
    - name: kot149       # <-- Mouse Gesture
      url-base: https://github.com/kot149
    - name: shakushakupanda  # <-- mouse gesture RPC module
      url-base: https://github.com/shakushakupanda
  projects:
    # ── ZMK 本体は cormoran さんの DYA Studio 対応 fork に切替 ──
    - name: zmk
      remote: cormoran
      revision: v0.3-branch+dya
      import: app/west.yml
    # ── DYA Studio modules ──
    - name: zmk-module-ble-management
      remote: cormoran
      revision: 851661c
    # zmk-module-battery-history は使わないので無効化
    # - name: zmk-module-battery-history
    #   remote: cormoran
    #   revision: main
    - name: zmk-module-settings-rpc
      remote: cormoran
      revision: main
    - name: zmk-module-runtime-input-processor
      remote: cormoran
      revision: dbf92f7
    - name: zmk-behavior-runtime-sensor-rotate
      remote: cormoran
      revision: main
    # ── 既存モジュール ──
    - name: zmk-pmw3610-driver
      remote: badjeff
      revision: zmk-0.3
    - name: zmk-driver-paw3222
      remote: sekigon-gonnoc
      revision: main
    - name: zmk-rgbled-widget
      remote: caksoylar
      revision: v0.3
    - name: zmk-input-processor-keybind
      remote: zettaface
      revision: main
    # ── Mouse Gesture (kot149 + custom RPC) ──
    - name: zmk-mouse-gesture
      remote: shakushakupanda      # <-- Phase 5: forked with runtime trie API
      revision: v1
    - name: zmk-module-mouse-gesture-rpc
      remote: shakushakupanda
      revision: expose-mg-set-to-studio
  self:
    path: config
